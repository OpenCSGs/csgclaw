# GitLab CI: release on tag v*.
#
# Platform list: scripts/release-platforms.txt — keep parallel.matrix below in sync (same GOOS/GOARCH rows).
#
# Triggers:
#   - tag v* — release archives, csgclaw Docker image, SSH upload
#
# Implementation: scripts/release-build-all.sh (per matrix cell); .gitlab/ci-gitlab-release-upload.sh (upload only);
# .gitlab/bookworm-mirror.sh (apt sources).
#
# Required CI/CD variables:
#   REMOTE_SSH – e.g. root@cdn.example.com
#   ACR_REGISTRY – registry hostname only (no scheme)
#   Toolchain mirrors: ${ACR_REGISTRY}/opencsg_public/ (golang, alpine, kaniko)
#   Product images: ${ACR_REGISTRY}/opencsghq/ (csgclaw, node)
#   ACR_USERNAME / ACR_PASSWORD – credentials with push access to ${ACR_REGISTRY}/opencsghq/csgclaw
#
# Recommended:
#   SSH_PRIVATE_KEY – PEM text (Variable) OR GitLab “File” variable (value is a path in the job; script copies to ~/.ssh/id_rsa)
#   SSH_KNOWN_HOSTS – host keys for ssh (recommended)
#
# Optional:
#   SSH_PORT – default 22
#   REMOTE_BASE_DIR – default /data/csgclaw (releases under .../releases/<tag>/)
#   BOXLITE_CLI_VERSION – default v0.9.0
#   BOXLITE_CLI_BASE_URL – boxlite-cli tarballs; default mirrors https://csgclaw.opencsg.com/boxlite-cli/{version}/{filename} (matches fetch-boxlite-cli.sh)
#   BOXLITE_CURL_INSECURE – default 1 (TLS inspection); set 0 if csgclaw.opencsg.com is trusted as-is
#   CSGCLAW_MACOS_CERTIFICATE_P12 – GitLab File variable for the Developer ID Application P12
#   CSGCLAW_MACOS_CERTIFICATE_PASSWORD / CSGCLAW_MACOS_SIGN_IDENTITY – enable macOS signing when both are set
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID – optional macOS notarization (all three required)
#   CSGCLAW_WINDOWS_CERTIFICATE_PFX – GitLab File variable for the Windows signing PFX
#   CSGCLAW_WINDOWS_CERTIFICATE_PASSWORD – enables Windows installer certificate signing when set with the PFX
#   CSGCLAW_WINDOWS_SIGN_TOOL / CSGCLAW_WINDOWS_SIGN_PARAMS – optional full Windows signing command (both required)
#
# Debian apt: before install, rewrite official mirrors to Aliyun (faster in CN). Override DEBIAN_APT_MIRROR_* in CI vars if needed.
#
# Go modules: GOPROXY defaults below (mainland-friendly). Override in CI/CD Variables if needed.
#
# CI images: Alibaba Cloud ACR mirrors (Runner cannot use docker.io).
# Set ACR_REGISTRY in CI/CD Variables. Push mirrors once, e.g.:
#   docker login ${ACR_REGISTRY}
#   docker tag golang:bookworm ${ACR_REGISTRY}/opencsg_public/golang:bookworm
#   docker push ${ACR_REGISTRY}/opencsg_public/golang:bookworm
#   docker tag golang:1.26.2-alpine ${ACR_REGISTRY}/opencsg_public/golang:1.26.2-alpine
#   docker push ${ACR_REGISTRY}/opencsg_public/golang:1.26.2-alpine
#   docker tag alpine:3.23 ${ACR_REGISTRY}/opencsg_public/alpine:3.23
#   docker push ${ACR_REGISTRY}/opencsg_public/alpine:3.23
#   docker pull --platform linux/amd64 node:22.13.0-bookworm-slim
#   docker tag node:22.13.0-bookworm-slim ${ACR_REGISTRY}/opencsghq/node:22.13.0-bookworm-slim
#   docker push ${ACR_REGISTRY}/opencsghq/node:22.13.0-bookworm-slim
#   docker pull --platform linux/amd64 node:22.13.0-alpine
#   docker tag node:22.13.0-alpine ${ACR_REGISTRY}/opencsghq/node:22.13.0-alpine
#   docker push ${ACR_REGISTRY}/opencsghq/node:22.13.0-alpine
#   docker tag gcr.io/kaniko-project/executor:debug ${ACR_REGISTRY}/opencsg_public/kaniko-executor:debug
#   docker push ${ACR_REGISTRY}/opencsg_public/kaniko-executor:debug

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  BOXLITE_CLI_VERSION: "v0.9.0"
  BOXLITE_CLI_BASE_URL: "https://csgclaw.opencsg.com/boxlite-cli"
  BOXLITE_CURL_INSECURE: "1"
  GOTOOLCHAIN: "auto"
  GOPROXY: "https://goproxy.cn,direct"
  DEBIAN_APT_MIRROR_DEB: "http://mirrors.aliyun.com/debian"
  DEBIAN_APT_MIRROR_SEC: "http://mirrors.aliyun.com/debian-security"

stages:
  - web
  - release
  - upload

.release_rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

.release_image:
  image:
    name: ${ACR_REGISTRY}/opencsg_public/golang:bookworm

.web_image:
  image:
    name: ${ACR_REGISTRY}/opencsghq/node:22.13.0-bookworm-slim

.kaniko_image:
  image:
    name: ${ACR_REGISTRY}/opencsg_public/kaniko-executor:debug
    entrypoint: [""]

.kaniko_acr_auth:
  before_script:
    - test -n "${ACR_REGISTRY}"
    - test -n "${ACR_USERNAME}"
    - test -n "${ACR_PASSWORD}"
    - mkdir -p /kaniko/.docker
    - export ACR_AUTH="$(printf '%s:%s' "$ACR_USERNAME" "$ACR_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$ACR_REGISTRY" "$ACR_AUTH" > /kaniko/.docker/config.json

web-build:
  extends:
    - .web_image
    - .release_rules
  stage: web
  before_script:
    - npm install -g pnpm@11.1.3
    - node --version
    - pnpm --version
  script:
    - pnpm --dir web/app install --frozen-lockfile
    - mkdir -p web/static-dist
    - pnpm --dir web/app build
    - test -f web/static-dist/index.html
  artifacts:
    paths:
      - web/static-dist/
    expire_in: 1 day

# Must match scripts/release-platforms.txt (order need not match; set must match).
release-build:
  extends:
    - .release_image
    - .release_rules
  stage: release
  needs:
    - job: web-build
      artifacts: true
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: amd64
      - GOOS: linux
        GOARCH: arm64
      - GOOS: darwin
        GOARCH: arm64
      - GOOS: darwin
        GOARCH: amd64
      - GOOS: windows
        GOARCH: amd64
  before_script:
    - chmod +x .gitlab/bookworm-mirror.sh scripts/release-build-all.sh
    - bash .gitlab/bookworm-mirror.sh
    - apt-get update -qq && apt-get install -y --no-install-recommends zip ca-certificates
  script:
    - export VERSION="$CI_COMMIT_TAG"
    - export COMMIT="$(git rev-parse --short HEAD)"
    - export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - export DIST_DIR="${DIST_DIR:-dist}"
    - mkdir -p "$DIST_DIR" "${CI_PROJECT_DIR}/.gocache"
    - export GOCACHE="${GOCACHE:-${CI_PROJECT_DIR}/.gocache}"
    - export BOXLITE_CLI_VERSION="${BOXLITE_CLI_VERSION:-v0.9.0}"
    - ./scripts/release-build-all.sh "$GOOS" "$GOARCH"
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

desktop-build-linux:
  extends:
    - .release_image
    - .release_rules
  stage: release
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: amd64
      - GOOS: linux
        GOARCH: arm64
  before_script:
    - chmod +x .gitlab/bookworm-mirror.sh
    - bash .gitlab/bookworm-mirror.sh
    - apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl dpkg fakeroot xz-utils
    - |
      NODE_VERSION="$(tr -d '[:space:]' < .nvmrc)"
      case "$(uname -m)" in
        x86_64|amd64) NODE_ARCH=x64 ;;
        aarch64|arm64) NODE_ARCH=arm64 ;;
        *) echo "unsupported Linux runner architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" -o /tmp/node.tar.xz
      tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      corepack enable
      node --version
      pnpm --version
  script:
    - export VERSION="$CI_COMMIT_TAG"
    - export COMMIT="$(git rev-parse --short HEAD)"
    - export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - export GOCACHE="${CI_PROJECT_DIR}/.gocache"
    - make desktop-package TARGET_OS="$GOOS" TARGET_ARCH="$GOARCH"
    - node scripts/collect-desktop-release-assets.mjs "$VERSION" "$GOOS" "$GOARCH" desktop/out/make dist
  artifacts:
    paths:
      - dist/csgclaw-desktop_*
    expire_in: 1 day

desktop-build-macos:
  extends: .release_rules
  stage: release
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - GOARCH: arm64
        RUNNER_TAG: csgclaw-macos-arm64
      - GOARCH: amd64
        RUNNER_TAG: csgclaw-macos-amd64
  tags:
    - $RUNNER_TAG
  before_script:
    - node --version
    - corepack enable
    - pnpm --version
    - |
      requested_identity="${CSGCLAW_MACOS_SIGN_IDENTITY:-}"
      requested_apple_id="${APPLE_ID:-}"
      requested_apple_password="${APPLE_PASSWORD:-}"
      requested_apple_team_id="${APPLE_TEAM_ID:-}"
      unset CSGCLAW_MACOS_SIGN_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID

      if [ -z "${CSGCLAW_MACOS_CERTIFICATE_P12:-}" ] || [ -z "${CSGCLAW_MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${requested_identity}" ]; then
        echo "macOS signing is not fully configured; using Forge defaults."
      elif [ ! -f "${CSGCLAW_MACOS_CERTIFICATE_P12}" ]; then
        echo "CSGCLAW_MACOS_CERTIFICATE_P12 must be a GitLab File variable." >&2
        exit 1
      else
        keychain_path="${CI_PROJECT_DIR}/.csgclaw-signing.keychain-db"
        keychain_password="$(openssl rand -hex 32)"
        security create-keychain -p "${keychain_password}" "${keychain_path}"
        security set-keychain-settings -lut 21600 "${keychain_path}"
        security unlock-keychain -p "${keychain_password}" "${keychain_path}"
        security import "${CSGCLAW_MACOS_CERTIFICATE_P12}" -k "${keychain_path}" -P "${CSGCLAW_MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
        security list-keychains -d user -s "${keychain_path}"
        export CSGCLAW_MACOS_SIGN_IDENTITY="${requested_identity}"

        if [ -n "${requested_apple_id}" ] && [ -n "${requested_apple_password}" ] && [ -n "${requested_apple_team_id}" ]; then
          export APPLE_ID="${requested_apple_id}"
          export APPLE_PASSWORD="${requested_apple_password}"
          export APPLE_TEAM_ID="${requested_apple_team_id}"
        fi
      fi
  script:
    - export VERSION="$CI_COMMIT_TAG"
    - export COMMIT="$(git rev-parse --short HEAD)"
    - export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - export GOCACHE="${CI_PROJECT_DIR}/.gocache"
    - make desktop-package TARGET_OS=darwin TARGET_ARCH="$GOARCH"
    - node scripts/collect-desktop-release-assets.mjs "$VERSION" darwin "$GOARCH" desktop/out/make dist
  after_script:
    - security delete-keychain "${CI_PROJECT_DIR}/.csgclaw-signing.keychain-db" || true
  artifacts:
    paths:
      - dist/csgclaw-desktop_*
    expire_in: 1 day

desktop-build-windows:
  extends: .release_rules
  stage: release
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      allow_failure: true
  tags:
    - csgclaw-windows-amd64
  before_script:
    - $ErrorActionPreference = 'Stop'
    - node --version
    - corepack enable
    - pnpm --version
    - |
      $certificatePassword = $env:CSGCLAW_WINDOWS_CERTIFICATE_PASSWORD
      $signTool = $env:CSGCLAW_WINDOWS_SIGN_TOOL
      $signParams = $env:CSGCLAW_WINDOWS_SIGN_PARAMS
      Remove-Item Env:CSGCLAW_WINDOWS_CERTIFICATE_FILE -ErrorAction SilentlyContinue
      Remove-Item Env:CSGCLAW_WINDOWS_CERTIFICATE_PASSWORD -ErrorAction SilentlyContinue
      Remove-Item Env:CSGCLAW_WINDOWS_SIGN_TOOL -ErrorAction SilentlyContinue
      Remove-Item Env:CSGCLAW_WINDOWS_SIGN_PARAMS -ErrorAction SilentlyContinue

      if ($env:CSGCLAW_WINDOWS_CERTIFICATE_PFX -and $certificatePassword) {
        if (-not (Test-Path -LiteralPath $env:CSGCLAW_WINDOWS_CERTIFICATE_PFX -PathType Leaf)) {
          throw 'CSGCLAW_WINDOWS_CERTIFICATE_PFX must be a GitLab File variable.'
        }
        $env:CSGCLAW_WINDOWS_CERTIFICATE_FILE = $env:CSGCLAW_WINDOWS_CERTIFICATE_PFX
        $env:CSGCLAW_WINDOWS_CERTIFICATE_PASSWORD = $certificatePassword
      }
      else {
        Write-Host 'Windows certificate signing is not fully configured; using Forge defaults.'
      }

      if ($signTool -and $signParams) {
        $env:CSGCLAW_WINDOWS_SIGN_TOOL = $signTool
        $env:CSGCLAW_WINDOWS_SIGN_PARAMS = $signParams
      }
  script:
    - $env:VERSION = $env:CI_COMMIT_TAG
    - $env:COMMIT = (git rev-parse --short HEAD)
    - $env:BUILD_TIME = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
    - $env:GOCACHE = Join-Path $env:CI_PROJECT_DIR '.gocache'
    - .\scripts\build.cmd desktop-package
    - node scripts/collect-desktop-release-assets.mjs $env:VERSION windows amd64 desktop/out/make dist
  artifacts:
    paths:
      - dist/csgclaw-desktop_*
    expire_in: 1 day

docker-build-amd64:
  extends:
    - .kaniko_image
    - .kaniko_acr_auth
    - .release_rules
  stage: release
  needs:
    - job: web-build
      artifacts: true
  script:
    - export COMMIT="$(git rev-parse --short HEAD)"
    - export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --custom-platform linux/amd64 \
        --destination "${ACR_REGISTRY}/opencsghq/csgclaw:${CI_COMMIT_TAG}" \
        --build-arg GO_IMAGE="${ACR_REGISTRY}/opencsg_public/golang:1.26.2-alpine" \
        --build-arg NODE_IMAGE="${ACR_REGISTRY}/opencsghq/node:22.13.0-alpine" \
        --build-arg RUNTIME_IMAGE="${ACR_REGISTRY}/opencsg_public/alpine:3.23" \
        --build-arg GOPROXY="${GOPROXY}" \
        --build-arg VERSION="${CI_COMMIT_TAG}" \
        --build-arg COMMIT="${COMMIT}" \
        --build-arg BUILD_TIME="${BUILD_TIME}"

release-upload:
  extends:
    - .release_image
    - .release_rules
  stage: upload
  needs:
    - job: release-build
      artifacts: true
    - job: docker-build-amd64
      artifacts: false
  before_script:
    - chmod +x .gitlab/bookworm-mirror.sh
    - bash .gitlab/bookworm-mirror.sh
    - apt-get update -qq && apt-get install -y --no-install-recommends openssh-client python3 ca-certificates
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -z "${REMOTE_SSH}" ]; then
        echo "REMOTE_SSH must be set in CI/CD variables" >&2
        exit 1
      fi
    - |
      if [ -n "${SSH_PRIVATE_KEY}" ]; then
        if [ -f "${SSH_PRIVATE_KEY}" ]; then
          cp "${SSH_PRIVATE_KEY}" ~/.ssh/id_rsa
        else
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_rsa
        fi
        chmod 600 ~/.ssh/id_rsa
        export SSH_IDENTITY_FILE="${HOME}/.ssh/id_rsa"
      fi
    - |
      if [ -n "${SSH_KNOWN_HOSTS}" ]; then
        printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
      else
        KEYSCAN_HOST="${REMOTE_SSH##*@}"
        if ! ssh-keyscan -p "${SSH_PORT:-22}" "${KEYSCAN_HOST}" >> ~/.ssh/known_hosts 2>/dev/null; then
          echo "ssh-keyscan failed; set SSH_KNOWN_HOSTS in CI variables" >&2
          exit 1
        fi
      fi
  script:
    - bash .gitlab/ci-gitlab-release-upload.sh
