name: Republish desktop OSS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag, for example v0.8.0-beta.1"
        required: true
        type: string
      source_run_id:
        description: "Release workflow run containing the original build artifacts"
        required: true
        type: string

permissions:
  contents: read

env:
  OSSUTIL_VERSION: "2.3.0"
  OSSUTIL_LINUX_AMD64_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.validate.outputs.channel }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/package.json

      - name: Validate source release run
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must be a numeric workflow run ID."
            exit 1
          fi
          read -r run_sha run_event < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
              --jq '[.head_sha, .event] | @tsv'
          )
          if [[ "${run_event}" != push || "${run_sha}" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The source run must be a tag push for ${VERSION}."
            exit 1
          fi
          echo "channel=$(node scripts/desktop-release-artifacts.mjs channel "${VERSION}")" >> "${GITHUB_OUTPUT}"

  publish:
    needs: prepare
    concurrency:
      group: desktop-oss-${{ needs.prepare.outputs.channel }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    environment:
      name: oss-publish
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/package.json

      - name: Download desktop release artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: desktop-dist-*
          path: desktop-release
          merge-multiple: true

      - name: Download Server and CLI release artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: dist-*
          path: desktop-release
          merge-multiple: true

      - name: Install ossutil
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          extract_dir="${RUNNER_TEMP}/ossutil"
          bin_dir="${RUNNER_TEMP}/ossutil-bin"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${archive}" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          printf '%s  %s\n' "${OSSUTIL_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check -
          unzip -q "${archive}" -d "${extract_dir}"
          install -Dm755 \
            "${extract_dir}/ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" \
            "${bin_dir}/ossutil"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Validate OSS credentials
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [[ -z "${OSS_ACCESS_KEY_ID}" || -z "${OSS_ACCESS_KEY_SECRET}" ]]; then
            echo "::error::Configure OSS credentials in the oss-publish environment."
            exit 1
          fi

      - name: Publish desktop installers to OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          make desktop-oss-publish \
            VERSION="${VERSION}" \
            DESKTOP_OSS_CHANNEL="${CHANNEL}" \
            DESKTOP_OSS_RELEASE_DIR=desktop-release \
            DESKTOP_OSS_REQUIRE_PACKAGES=1
